<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de encargos | SansAutorization</title>
  <link rel="icon" href="../img/logo-icono.svg" type="image/svg+xml">
  <style>
    :root { --azul: #0b4f6c; --verde: #1f8a4c; --fondo: #f3f6f9; --texto: #1d2733; --gris: #4f5968; --borde: #d5dde6; --blanco: #ffffff; --claro: #e8f1f6; --error: #a4001d; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--fondo); color: var(--texto); font-size: 15px; }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #0a6fa0; outline-offset: 2px; }
    header { background: var(--azul); color: var(--blanco); padding: 14px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
    header h1 { font-size: 1.2rem; margin: 0; }
    header button { background: var(--blanco); color: var(--azul); border: none; border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer; }
    .resumen { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 20px 0; }
    .chip { background: var(--blanco); border: 1px solid var(--borde); border-radius: 10px; padding: 8px 12px; }
    .chip b { color: var(--azul); }
    .mensaje { margin: 16px 20px 0; padding: 12px 14px; border-radius: 10px; background: #fff8e1; border: 1px solid #b98a00; display: none; }
    .tablero { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; padding: 16px 20px 30px; align-items: start; }
    .columna { background: #e7edf3; border-radius: 12px; padding: 10px; min-height: 120px; }
    .columna h2 { font-size: 0.95rem; margin: 4px 6px 10px; color: var(--azul); display: flex; justify-content: space-between; }
    .tarjeta { background: var(--blanco); border: 1px solid var(--borde); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .titulo { font-weight: 700; font-size: 1rem; }
    .meta { color: var(--gris); font-size: 0.9rem; margin: 2px 0 8px; }
    .detalle { font-size: 0.9rem; background: #f7f9fb; border-radius: 8px; padding: 6px 8px; margin-bottom: 8px; }
    .codigo { font-family: Consolas, monospace; color: var(--gris); font-size: 0.85rem; }
    .vacio { color: var(--gris); font-size: 0.9rem; padding: 8px; }
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    label { font-size: 0.8rem; color: var(--gris); display: block; margin-bottom: 2px; }
    select, input[type="number"], input[type="text"], textarea { width: 100%; font: inherit; padding: 6px; border: 1px solid var(--borde); border-radius: 6px; background: var(--blanco); }
    textarea { min-height: 70px; }
    .checks { display: flex; gap: 12px; margin-top: 8px; font-size: 0.9rem; }
    .checks label { display: flex; align-items: center; gap: 4px; color: var(--texto); margin: 0; }
    .boton-ver { margin-top: 6px; background: var(--claro); color: var(--azul); border: 1px solid #b9d3e0; border-radius: 8px; padding: 6px 12px; font: inherit; font-weight: 700; cursor: pointer; }
    .guardando { opacity: 0.6; }
    a { color: var(--azul); }

    /* ----- Detalle del caso ----- */
    #fondo { position: fixed; inset: 0; background: rgba(15, 30, 40, 0.35); display: none; z-index: 10; }
    #fondo.abierto { display: block; }
    #detalle { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--blanco); z-index: 11; overflow-y: auto; box-shadow: -8px 0 24px rgba(0, 0, 0, 0.2); padding: 20px; display: none; }
    #detalle.abierto { display: block; }
    #detalle h2 { color: var(--azul); font-size: 1.2rem; margin: 30px 0 4px; }
    #detalle h3 { font-size: 1rem; color: var(--azul); margin: 22px 0 8px; border-bottom: 1px solid var(--borde); padding-bottom: 4px; }
    #cerrar-detalle { background: var(--claro); color: var(--azul); border: 1px solid #b9d3e0; border-radius: 8px; padding: 6px 12px; font: inherit; font-weight: 700; cursor: pointer; float: right; }
    .datos dt { font-weight: 700; color: var(--azul); margin-top: 6px; font-size: 0.9rem; }
    .datos dd { margin: 0 0 2px 0; }
    .linea { list-style: none; padding: 0; margin: 0; border-left: 3px solid var(--borde); }
    .linea li { padding: 0 0 12px 14px; position: relative; }
    .linea li::before { content: ""; position: absolute; left: -8px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--verde); }
    .linea li small { color: var(--gris); display: block; }
    .bloque { background: #f7f9fb; border-radius: 10px; padding: 12px; margin-top: 8px; }
    .boton { background: var(--verde); color: var(--blanco); border: none; border-radius: 8px; padding: 9px 14px; font: inherit; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .boton:disabled { opacity: 0.6; cursor: default; }
    .error-detalle { color: var(--error); font-weight: 700; min-height: 1.2em; margin-top: 6px; }
  </style>
</head>
<body>

<header>
  <h1>Panel de encargos · SansAutorization</h1>
  <button type="button" id="recargar">Actualizar</button>
</header>

<div class="resumen" id="resumen"></div>
<div class="mensaje" id="mensaje" role="alert"></div>
<div class="tablero" id="tablero"></div>

<div id="fondo"></div>
<aside id="detalle" role="dialog" aria-modal="true" aria-labelledby="detalle-titulo">
  <button type="button" id="cerrar-detalle">Cerrar</button>
  <div id="detalle-contenido"></div>
</aside>

<script>
  const ESTADOS = ["Recibido", "Documentos pendientes", "Radicado", "En espera", "Resuelto", "Rechazado"];
  const NIVELES = ["Sin definir", "Simple", "Medio", "Complejo"];

  const tablero = document.getElementById("tablero");
  const resumen = document.getElementById("resumen");
  const mensaje = document.getElementById("mensaje");
  const detalle = document.getElementById("detalle");
  const fondo = document.getElementById("fondo");
  const detalleContenido = document.getElementById("detalle-contenido");
  let casos = [];
  let casoAbierto = null;

  function mostrarError(texto) {
    mensaje.textContent = texto;
    mensaje.style.display = texto ? "block" : "none";
  }

  function el(tag, props, hijos) {
    const nodo = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (props[k] === null || props[k] === undefined) return;
      if (k === "className") nodo.className = props[k];
      else if (k === "text") nodo.textContent = props[k];
      else nodo.setAttribute(k, props[k]);
    });
    (hijos || []).forEach(function (h) { if (h) nodo.appendChild(h); });
    return nodo;
  }

  function pesos(n) { return n == null ? "—" : "$" + Number(n).toLocaleString("es-CO"); }

  function fecha(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString("es-CO") + " " + d.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
  }

  function codigoBonito(c) { return c ? c.slice(0, 4) + "-" + c.slice(4) : "—"; }

  async function cargar() {
    mostrarError("");
    try {
      const r = await fetch("/api/casos");
      if (r.status === 401) { mostrarError("Usuario o contraseña incorrectos. Recargue la página para intentar de nuevo."); return; }
      if (!r.ok) { mostrarError("No se pudieron cargar los casos (código " + r.status + ")."); return; }
      casos = await r.json();
      pintar();
      if (casoAbierto) abrirDetalle(casoAbierto, false);
    } catch (e) {
      mostrarError("No hay conexión con el servidor.");
    }
  }

  // Envía cambios a un caso. Devuelve true si se guardó.
  async function guardar(id, cambios, tarjeta) {
    if (tarjeta) tarjeta.classList.add("guardando");
    let ok = false;
    try {
      const r = await fetch("/api/casos/" + id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cambios)
      });
      if (r.ok) {
        ok = true;
        mostrarError("");
      } else {
        const datos = await r.json().catch(function () { return {}; });
        mostrarError((datos.errores || ["No se pudo guardar el cambio."]).join(" "));
      }
    } catch (e) {
      mostrarError("No se pudo guardar. Revise la conexión.");
    }
    await cargar();
    return ok;
  }

  function tarjetaDe(caso) {
    const estado = el("select", { "aria-label": "Estado" }, ESTADOS.map(function (s) {
      return el("option", { value: s, text: s, selected: s === caso.estado ? "selected" : null });
    }));
    estado.addEventListener("change", function () { guardar(caso.id, { estado: estado.value }, tarjeta); });

    const nivel = el("select", { "aria-label": "Nivel" }, NIVELES.map(function (n) {
      const valor = n === "Sin definir" ? "" : n;
      return el("option", { value: valor, text: n, selected: (caso.nivel || "") === valor ? "selected" : null });
    }));
    nivel.addEventListener("change", function () { if (nivel.value) guardar(caso.id, { nivel: nivel.value }, tarjeta); });

    const minutos = el("input", { type: "number", min: "0", "aria-label": "Minutos", value: caso.minutos == null ? "" : String(caso.minutos), placeholder: "min" });
    minutos.addEventListener("change", function () { if (minutos.value !== "") guardar(caso.id, { minutos: parseInt(minutos.value, 10) }, tarjeta); });

    const adelanto = el("input", { type: "checkbox", ...(caso.adelantoPagado ? { checked: "checked" } : {}) });
    adelanto.addEventListener("change", function () { guardar(caso.id, { adelantoPagado: adelanto.checked }, tarjeta); });

    const saldo = el("input", { type: "checkbox", ...(caso.saldoPagado ? { checked: "checked" } : {}) });
    saldo.addEventListener("change", function () { guardar(caso.id, { saldoPagado: saldo.checked }, tarjeta); });

    const botonVer = el("button", { type: "button", className: "boton-ver", text: "Ver historial y notas" });
    botonVer.addEventListener("click", function () { abrirDetalle(caso.id, true); });

    const tarjeta = el("article", { className: "tarjeta" }, [
      el("div", { className: "codigo", text: "Código " + codigoBonito(caso.codigo) }),
      el("div", { className: "titulo", text: caso.nombre }),
      el("div", { className: "meta", text: caso.municipio + " · " + caso.eps + " · " + fecha(caso.creadoEn) }),
      el("div", { className: "detalle", text: caso.tramite + (caso.detalle ? ": " + caso.detalle : "") }),
      el("div", { className: "meta" }, (caso.adjuntos || []).map(function (a) {
        return el("a", { href: "/api/casos/" + caso.id + "/adjuntos/" + a.id, target: "_blank", rel: "noopener", text: "Adjunto: " + a.nombre });
      })),
      el("div", { className: "meta" }, [
        el("a", { href: "https://wa.me/57" + caso.telefono, target: "_blank", rel: "noopener", text: "WhatsApp " + caso.telefono })
      ]),
      el("div", { className: "fila" }, [
        el("div", {}, [el("label", { text: "Nivel" }), nivel]),
        el("div", {}, [el("label", { text: "Minutos" }), minutos])
      ]),
      el("div", { className: "meta", text: "Precio: " + pesos(caso.precio) }),
      el("div", { className: "checks" }, [
        el("label", {}, [adelanto, document.createTextNode(" Adelanto 50%")]),
        el("label", {}, [saldo, document.createTextNode(" Saldo pagado")])
      ]),
      el("div", { className: "fila" }, [
        el("div", { style: "grid-column: 1 / -1" }, [el("label", { text: "Estado" }), estado])
      ]),
      botonVer
    ]);
    return tarjeta;
  }

  function pintar() {
    const porCobrar = casos
      .filter(function (c) { return c.precio != null && !c.saldoPagado; })
      .reduce(function (suma, c) { return suma + c.precio; }, 0);
    resumen.innerHTML = "";
    resumen.appendChild(el("div", { className: "chip" }, [document.createTextNode("Casos: "), el("b", { text: String(casos.length) })]));
    resumen.appendChild(el("div", { className: "chip" }, [document.createTextNode("Por cobrar: "), el("b", { text: pesos(porCobrar) })]));

    tablero.innerHTML = "";
    ESTADOS.forEach(function (estado) {
      const delEstado = casos.filter(function (c) { return c.estado === estado; });
      const cuerpo = delEstado.length ? delEstado.map(tarjetaDe) : [el("div", { className: "vacio", text: "Sin casos" })];
      tablero.appendChild(el("section", { className: "columna" }, [
        el("h2", {}, [el("span", { text: estado }), el("span", { text: String(delEstado.length) })])
      ].concat(cuerpo)));
    });
  }

  // ===== Detalle del caso =====
  async function abrirDetalle(id, enfocar) {
    casoAbierto = id;
    let caso;
    try {
      const r = await fetch("/api/casos/" + id);
      if (!r.ok) { mostrarError("No se encontró el caso."); return; }
      caso = await r.json();
    } catch (e) {
      mostrarError("No hay conexión con el servidor.");
      return;
    }
    pintarDetalle(caso);
    detalle.classList.add("abierto");
    fondo.classList.add("abierto");
    if (enfocar) document.getElementById("cerrar-detalle").focus();
  }

  function cerrarDetalle() {
    casoAbierto = null;
    detalle.classList.remove("abierto");
    fondo.classList.remove("abierto");
  }

  function pintarDetalle(c) {
    detalleContenido.innerHTML = "";

    detalleContenido.appendChild(el("h2", { id: "detalle-titulo", text: "Caso " + codigoBonito(c.codigo) }));
    detalleContenido.appendChild(el("p", { className: "meta", text: c.nombre + " · " + c.tramite + " · " + c.estado }));

    detalleContenido.appendChild(el("dl", { className: "datos" }, [
      el("dt", { text: "WhatsApp" }), el("dd", { text: c.telefono }),
      el("dt", { text: "Municipio" }), el("dd", { text: c.municipio }),
      el("dt", { text: "EPS" }), el("dd", { text: c.eps }),
      el("dt", { text: "Detalle" }), el("dd", { text: c.detalle || "—" }),
      el("dt", { text: "Solicitud" }), el("dd", { text: fecha(c.creadoEn) }),
      el("dt", { text: "Nivel y precio" }), el("dd", { text: (c.nivel || "Sin definir") + " · " + pesos(c.precio) })
    ]));

    // Archivos
    detalleContenido.appendChild(el("h3", { text: "Archivos" }));
    if (!c.adjuntos.length) {
      detalleContenido.appendChild(el("p", { className: "meta", text: "El cliente no adjuntó archivos." }));
    } else {
      c.adjuntos.forEach(function (a) {
        detalleContenido.appendChild(el("p", {}, [el("a", { href: "/api/casos/" + c.id + "/adjuntos/" + a.id, target: "_blank", rel: "noopener", text: a.nombre })]));
      });
    }

    // Avance del trámite
    detalleContenido.appendChild(el("h3", { text: "Avance del trámite" }));
    const historial = el("ol", { className: "linea" });
    c.historial.forEach(function (h) {
      historial.appendChild(el("li", {}, [
        el("strong", { text: h.estado }),
        el("small", { text: fecha(h.fecha) }),
        h.nota ? el("small", { text: h.nota }) : null
      ]));
    });
    detalleContenido.appendChild(historial);

    // Cambiar estado con nota para el historial
    const selectEstado = el("select", { id: "nuevo-estado", "aria-label": "Nuevo estado" }, ESTADOS.map(function (s) {
      return el("option", { value: s, text: s, selected: s === c.estado ? "selected" : null });
    }));
    const nota = el("textarea", { "aria-label": "Nota del paso", placeholder: "Qué pasó en este paso (opcional). Se guarda en el historial." });
    const errorEstado = el("div", { className: "error-detalle", role: "alert" });
    const botonEstado = el("button", { type: "button", className: "boton", text: "Guardar cambio de estado" });
    botonEstado.addEventListener("click", async function () {
      botonEstado.disabled = true;
      const ok = await guardar(c.id, { estado: selectEstado.value, nota: nota.value.trim() || null }, null);
      if (!ok) { errorEstado.textContent = "No se pudo guardar el cambio."; botonEstado.disabled = false; }
    });
    detalleContenido.appendChild(el("div", { className: "bloque" }, [
      el("label", { text: "Cambiar estado" }), selectEstado,
      el("label", { text: "Nota del paso", style: "margin-top:8px" }), nota,
      botonEstado, errorEstado
    ]));

    // Notas internas
    detalleContenido.appendChild(el("h3", { text: "Notas internas (solo la gestora)" }));
    if (!c.notas.length) {
      detalleContenido.appendChild(el("p", { className: "meta", text: "Todavía no hay notas." }));
    } else {
      const lista = el("ol", { className: "linea" });
      c.notas.forEach(function (n) {
        lista.appendChild(el("li", {}, [el("small", { text: fecha(n.fecha) }), document.createTextNode(n.texto)]));
      });
      detalleContenido.appendChild(lista);
    }
    const textoNota = el("textarea", { "aria-label": "Nueva nota", placeholder: "Escriba una nota interna" });
    const errorNota = el("div", { className: "error-detalle", role: "alert" });
    const botonNota = el("button", { type: "button", className: "boton", text: "Agregar nota" });
    botonNota.addEventListener("click", async function () {
      const texto = textoNota.value.trim();
      if (!texto) { errorNota.textContent = "Escriba la nota antes de guardarla."; return; }
      botonNota.disabled = true;
      try {
        const r = await fetch("/api/casos/" + c.id + "/notas", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ texto: texto })
        });
        if (!r.ok) { errorNota.textContent = "No se pudo guardar la nota."; botonNota.disabled = false; return; }
        await cargar();
      } catch (e) {
        errorNota.textContent = "No hay conexión con el servidor.";
        botonNota.disabled = false;
      }
    });
    detalleContenido.appendChild(el("div", { className: "bloque" }, [textoNota, botonNota, errorNota]));
  }

  document.getElementById("cerrar-detalle").addEventListener("click", cerrarDetalle);
  fondo.addEventListener("click", cerrarDetalle);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") cerrarDetalle(); });
  document.getElementById("recargar").addEventListener("click", cargar);
  cargar();
</script>

</body>
</html>

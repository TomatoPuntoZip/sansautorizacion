<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ver mi caso | SansAutorization</title>
  <link rel="icon" href="img/logo-icono.svg" type="image/svg+xml">
  <style>
    :root { --azul: #0b4f6c; --azul-claro: #e8f1f6; --verde: #1f8a4c; --fondo: #f6f8fa; --texto: #1d2733; --gris: #4f5968; --borde: #d5dde6; --blanco: #ffffff; --error: #a4001d; }
    * { box-sizing: border-box; }
    html { font-size: 19px; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--fondo); color: var(--texto); line-height: 1.55; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #0a6fa0; outline-offset: 3px; }
    header { background: var(--azul); padding: 16px 0; }
    .contenedor { max-width: 760px; margin: 0 auto; padding: 0 18px; }
    .logo { display: block; background: #ffffff; padding: 8px 12px; border-radius: 12px; height: 44px; width: auto; }
    header a { color: #ffffff; font-weight: 700; }
    h1 { color: var(--azul); font-size: 1.9rem; margin: 26px 0 6px; }
    .subtitulo { color: var(--gris); margin: 0 0 20px; }
    form { background: var(--blanco); border: 1px solid var(--borde); border-radius: 16px; padding: 22px; }
    label { display: block; font-weight: 700; margin: 14px 0 6px; }
    label:first-child { margin-top: 0; }
    input { width: 100%; font: inherit; padding: 12px; border: 2px solid var(--borde); border-radius: 10px; }
    .ayuda { color: var(--gris); font-size: 0.95rem; margin: 6px 0 0; }
    .boton { margin-top: 18px; background: var(--verde); color: #ffffff; border: none; border-radius: 12px; padding: 13px 20px; font: inherit; font-weight: 700; font-size: 1.1rem; cursor: pointer; }
    .boton:hover { background: #166b3a; }
    .error { color: var(--error); font-weight: 700; min-height: 1.2em; margin: 12px 0 0; }
    .resultado { display: none; margin-top: 24px; background: var(--blanco); border: 1px solid var(--borde); border-radius: 16px; padding: 22px; }
    .resultado.activo { display: block; }
    .estado { display: inline-block; background: var(--azul-claro); color: var(--azul); font-weight: 800; border-radius: 999px; padding: 6px 14px; font-size: 1.1rem; }
    ol.linea { list-style: none; padding: 0; margin: 18px 0 0; border-left: 3px solid var(--borde); }
    ol.linea li { position: relative; padding: 0 0 16px 18px; }
    ol.linea li::before { content: ""; position: absolute; left: -9px; top: 6px; width: 14px; height: 14px; border-radius: 50%; background: var(--verde); }
    ol.linea li strong { display: block; }
    ol.linea li span { color: var(--gris); font-size: 0.95rem; }
    .pie { color: var(--gris); font-size: 0.95rem; margin-top: 14px; }
  </style>
</head>
<body>
<header>
  <div class="contenedor">
    <a href="index.html"><img class="logo" src="img/logo.svg" alt="SansAutorization" width="220" height="32"></a>
  </div>
</header>

<main class="contenedor">
  <h1>Ver el avance de mi caso</h1>
  <p class="subtitulo">Escriba el código que le dimos al enviar su solicitud y los últimos 4 números de su WhatsApp.</p>

  <form id="formulario" novalidate>
    <label for="codigo">Código del caso</label>
    <input type="text" id="codigo" autocomplete="off" placeholder="Ej: ABCD-1234" maxlength="12" required>
    <p class="ayuda">Está en la confirmación que vio al enviar la solicitud.</p>

    <label for="ultimos">Últimos 4 números de su WhatsApp</label>
    <input type="tel" id="ultimos" inputmode="numeric" autocomplete="off" placeholder="Ej: 2965" maxlength="4" required>

    <p class="error" id="error" role="alert"></p>
    <button class="boton" type="submit">Ver mi caso</button>
  </form>

  <section class="resultado" id="resultado" aria-live="polite">
    <p>Trámite: <strong id="tramite"></strong></p>
    <p>Estado actual: <span class="estado" id="estado"></span></p>
    <p class="pie">Fecha de la solicitud: <span id="fecha-inicio"></span></p>
    <h2 style="font-size:1.3rem;color:var(--azul);margin:22px 0 0">Historial</h2>
    <ol class="linea" id="historial"></ol>
  </section>

  <p class="pie">¿Tiene dudas? Escríbanos por WhatsApp al 3202692965.</p>
</main>

<script>
  const formulario = document.getElementById("formulario");
  const error = document.getElementById("error");
  const resultado = document.getElementById("resultado");

  function fecha(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString("es-CO") + " " + d.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
  }

  formulario.addEventListener("submit", async function (evento) {
    evento.preventDefault();
    error.textContent = "";
    resultado.classList.remove("activo");

    const codigo = document.getElementById("codigo").value.trim();
    const ultimos = document.getElementById("ultimos").value.replace(/\D/g, "");
    if (codigo.replace(/[-\s]/g, "").length !== 8) { error.textContent = "El código tiene 8 letras o números."; return; }
    if (ultimos.length !== 4) { error.textContent = "Escriba los últimos 4 números de su WhatsApp."; return; }

    try {
      const r = await fetch("/api/seguimiento", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ codigo: codigo, ultimosCuatro: ultimos })
      });
      const datos = await r.json().catch(function () { return {}; });
      if (r.status === 429) { error.textContent = "Ha hecho muchos intentos. Espere 15 minutos o escríbanos por WhatsApp."; return; }
      if (!r.ok) { error.textContent = datos.mensaje || "No encontramos un caso con esos datos."; return; }

      document.getElementById("tramite").textContent = datos.tramite;
      document.getElementById("estado").textContent = datos.estado;
      document.getElementById("fecha-inicio").textContent = fecha(datos.creadoEn);

      const lista = document.getElementById("historial");
      lista.innerHTML = "";
      datos.historial.forEach(function (paso) {
        const li = document.createElement("li");
        const titulo = document.createElement("strong");
        titulo.textContent = paso.estado;
        const cuando = document.createElement("span");
        cuando.textContent = fecha(paso.fecha);
        li.appendChild(titulo);
        li.appendChild(cuando);
        lista.appendChild(li);
      });
      resultado.classList.add("activo");
    } catch (e) {
      error.textContent = "No pudimos conectar con el servidor. Intente de nuevo.";
    }
  });
</script>
</body>
</html>
